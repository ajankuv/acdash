# Weekly dependency update PRs. Each PR runs the full CI (unit + image smoke test).
# Merging one does NOT publish an image — it ships with the next regular push to main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /ci/fake_acinfinity
    schedule:
      interval: weekly

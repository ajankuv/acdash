# Weekly dependency update PRs. Each PR runs the full CI (unit + image smoke test).
# Merging one does NOT publish an image — it ships with the next regular push to main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ci/fake_acinfinity
    schedule:
      interval: weekly
    groups:
      fake-api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python version jumps (3.12 → 3.13+) are a deliberate decision, not a weekly PR. Security fixes
  # still land: every build pulls the current 3.12-alpine and runs `apk upgrade`.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directory: /ci/fake_acinfinity
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

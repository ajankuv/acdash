# Build Docker image and push to GitHub Container Registry (GHCR) — only after tests pass.
#
# - Push to `main`  → `ghcr.io/<owner>/<repo>:latest` (+ short SHA tag)
# - Push tag `v*`   → `ghcr.io/<owner>/<repo>:<semver>` and a GitHub Release
#
# Order: CI (unit + image smoke + upgrade tests, see ci.yml) → push ONLY :<sha> → pull and
# smoke-test that exact published image → promote it to :latest / :<semver>. Portainer's
# :latest never moves to an image that failed a check. The push rebuilds from the GHA layer
# cache the tested build produced.
#
# Portainer: use image `ghcr.io/<your-github-user>/<repo>:latest` or `:1.2.3`
# First time: repo → Settings → Actions → General → Workflow permissions → Read and write.
# Package may be private: github.com/<user>/<repo>/pkgs/container/<repo> → Package settings → Public.

name: Release & Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels + the :<sha> staging tag only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short

      - name: Short SHA tag
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  verify-published:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        id: img
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.docker.outputs.sha_tag }}"
          docker pull "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Hygiene + smoke test the published image
        env:
          ACDASH_IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          ci/smoke/hygiene.sh "$ACDASH_IMAGE"
          ci/smoke/run.sh

  promote:
    needs: [docker, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified :<sha> to :latest / :<semver>
        env:
          SHA_TAG: ${{ needs.docker.outputs.sha_tag }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=()
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then args+=(-t "$repo:latest"); fi
          case "$GITHUB_REF" in refs/tags/v*) args+=(-t "$repo:${GITHUB_REF_NAME#v}");; esac
          if [ ${#args[@]} -eq 0 ]; then echo "nothing to promote"; exit 0; fi
          docker buildx imagetools create "${args[@]}" "$repo:$SHA_TAG"
          echo "promoted $repo:$SHA_TAG → ${args[*]}"

  github-release:
    needs: promote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag (semver without leading v)
        id: sem
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            **Docker image (GHCR — use this in Portainer):**

            ```text
            ghcr.io/${{ github.repository }}:${{ steps.sem.outputs.tag }}
            ```

            Git tag is **`${{ github.ref_name }}`**; the container tag is **`${{ steps.sem.outputs.tag }}`** (no `v` prefix).

            For rolling updates from **`main`**, use **`ghcr.io/${{ github.repository }}:latest`** instead.

            This image passed unit tests and a container smoke test before and after publishing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

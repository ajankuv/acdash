# Tests every change: unit tests, then build the image and smoke-test the real container
# against a fake AC Infinity API (ci/fake_acinfinity). Never pushes images.
# Also called by release-docker.yml (workflow_call) so releases are gated on the same checks.

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]  # main runs these via release-docker.yml
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # same as the image
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app ci tools

      - name: Unit tests
        run: python -m pytest -q

  image:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: acdash:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image hygiene
        run: ci/smoke/hygiene.sh acdash:ci

      - name: Smoke test (fake AC Infinity API, default query write format)
        env:
          ACDASH_IMAGE: acdash:ci
        run: ci/smoke/run.sh

      - name: Smoke test (form write format)
        env:
          ACDASH_IMAGE: acdash:ci
          ACINFINITY_WRITE_FORMAT: form
        run: ci/smoke/run.sh

      - name: Pull currently published image (for upgrade test)
        id: prev
        continue-on-error: true
        run: |
          prev="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$prev" && echo "image=$prev" >> "$GITHUB_OUTPUT"

      - name: Upgrade + rollback test (published :latest → this build → :latest, one data volume)
        if: steps.prev.outputs.image != ''
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
        run: ci/smoke/upgrade.sh "$PREV_IMAGE" acdash:ci

      - name: Vulnerability scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acdash:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload scan to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy.sarif

      - name: Gate on critical CVEs (opt-in via repo variable TRIVY_FAIL_ON_CRITICAL=true)
        if: vars.TRIVY_FAIL_ON_CRITICAL == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acdash:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
